<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vroid-rs · avatar editor</title>
<style>
  :root{
    --bg:#15171c; --panel:#1d2027; --panel2:#242832; --line:#2e333f;
    --txt:#e7e9ee; --dim:#9aa2b1; --accent:#7aa2ff; --accent2:#ff8fb8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .app{display:flex;height:100%;overflow:hidden}
  .side{width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto}
  .brand{padding:16px 16px 8px;font-weight:700;letter-spacing:.3px;font-size:15px}
  .brand small{display:block;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:.2px}
  .group{padding:10px 16px;border-top:1px solid var(--line)}
  .group h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim)}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .row label{flex:1;color:var(--dim)}
  .row output{width:44px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums;font-size:12px}
  input[type=color]{width:40px;height:28px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel2);padding:2px;cursor:pointer}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:3px;
    background:var(--panel2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid var(--panel)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:none}
  select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font-size:13px;outline:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;
    padding:5px 10px;font-size:12px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 38%,#20242d 0%,#101217 70%);overflow:hidden}
  #view{max-width:100%;max-height:100%;image-rendering:auto;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));transition:opacity .12s}
  #view.loading{opacity:.45}
  .hud{position:absolute;left:14px;bottom:12px;color:var(--dim);font-size:11px;
    background:rgba(16,18,23,.6);padding:6px 10px;border-radius:8px;backdrop-filter:blur(6px)}
  .hud b{color:var(--txt);font-weight:600}
  .topright{position:absolute;right:14px;top:12px;display:flex;gap:8px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
    padding:8px 12px;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#0b1020;border-color:var(--accent);font-weight:600}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{flex:1;background:none;border:none;color:var(--dim);padding:8px 6px;font-size:12px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#0b1020;font-weight:600}
  .swatch{display:flex;align-items:center;gap:8px;margin:6px 0}
  .swatch span{flex:1;color:var(--dim);font-size:12px}
  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;flex:0 0 auto;max-height:46%;border-right:none;border-bottom:1px solid var(--line)}
    .stage{flex:1}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">vroid-rs<small>avatar editor · live preview</small></div>

    <div class="group">
      <h3>View</h3>
      <div class="seg" id="framing">
        <button data-frame="body" class="on">Body</button>
        <button data-frame="head">Head</button>
      </div>
      <div class="row"><label>Yaw</label><input id="yaw" type="range" min="-180" max="180" value="16" step="1"><output id="yaw_o">16°</output></div>
      <div class="row"><label>Pitch</label><input id="pitch" type="range" min="-40" max="40" value="4" step="1"><output id="pitch_o">4°</output></div>
      <div class="row"><label>Zoom</label><input id="zoom" type="range" min="0.5" max="2.2" value="1" step="0.01"><output id="zoom_o">1.00</output></div>
    </div>

    <div class="group">
      <h3>Colors</h3>
      <div class="swatch"><span>Hair</span><input id="hair" type="color" value="#c89a6b"></div>
      <div class="swatch"><span>Eyes</span><input id="eye" type="color" value="#9e6642"></div>
      <div class="swatch"><span>Skin</span><input id="skin" type="color" value="#ffd8c6"></div>
      <div class="row"><label>Hair on</label><input id="hairon" type="checkbox" checked></div>
    </div>

    <div class="group">
      <h3>Expression</h3>
      <select id="expr">
        <option value="none">— neutral —</option>
        <option value="happy">happy</option>
        <option value="angry">angry</option>
        <option value="sad">sad</option>
        <option value="relaxed">relaxed</option>
        <option value="surprised">surprised</option>
        <option value="blink">blink</option>
        <option value="blinkLeft">blink left</option>
        <option value="blinkRight">blink right</option>
        <option value="aa">mouth A</option>
        <option value="ih">mouth I</option>
        <option value="ou">mouth U</option>
        <option value="ee">mouth E</option>
        <option value="oh">mouth O</option>
      </select>
      <div class="row"><label>Weight</label><input id="w" type="range" min="0" max="1" value="0.72" step="0.01"><output id="w_o">0.72</output></div>
    </div>

    <div class="group">
      <h3>Face</h3>
      <div id="faceSliders"></div>
    </div>

    <div class="group">
      <h3>Background</h3>
      <div class="chips" id="bgs">
        <button class="chip on" data-bg="171a21">dark</button>
        <button class="chip" data-bg="2a2f3a">slate</button>
        <button class="chip" data-bg="dfe3ea">light</button>
        <button class="chip" data-bg="6c8bd6">blue</button>
      </div>
    </div>

    <div class="group">
      <button class="btn primary" id="save" style="width:100%">Download PNG</button>
    </div>
  </aside>

  <main class="stage">
    <div class="topright">
      <button class="btn" id="reset">Reset</button>
    </div>
    <img id="view" alt="avatar preview">
    <div class="hud"><b id="hud_state">ready</b> · <span id="hud_size">—</span></div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const BASES = (location.port === "8099")
  ? ["", "http://127.0.0.1:8099", "http://localhost:8099"]
  : ["http://127.0.0.1:8099", "http://localhost:8099", ""];
const state = {
  frame: "body", yaw: 16, pitch: 4, zoom: 1,
  hair: "#c89a6b", eye: "#9e6642", skin: "#ffd8c6", hairon: true,
  expr: "none", w: 0.72, bg: "171a21",
  face: {eye_size:0, eye_width:0, eye_height:0, eye_spacing:0, eye_angle:0, eye_y:0,
         brow_size:0, brow_y:0, brow_angle:0, nose_size:0, nose_y:0,
         mouth_size:0, mouth_width:0, mouth_y:0},
};
const FACE_SLIDERS = [
  ["eye_size","Eye size"],["eye_width","Eye width"],["eye_height","Eye height"],
  ["eye_spacing","Eye spacing"],["eye_angle","Eye angle"],["eye_y","Eye height pos"],
  ["brow_size","Brow size"],["brow_y","Brow height"],["brow_angle","Brow angle"],
  ["nose_size","Nose size"],["nose_y","Nose height"],
  ["mouth_size","Mouth size"],["mouth_width","Mouth width"],["mouth_y","Mouth height"],
];
for (const [key,label] of FACE_SLIDERS){
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<label>${label}</label><input id="f_${key}" type="range" min="-1" max="1" value="0" step="0.01"><output id="f_${key}_o">0.00</output>`;
  $("faceSliders").appendChild(row);
  $("f_"+key).oninput = e => { state.face[key] = +e.target.value; $("f_"+key+"_o").textContent = e.target.value; schedule(); };
}
let timer = null, reqId = 0;

function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

function buildQuery(){
  const p = new URLSearchParams();
  p.set("hair", state.hair);
  p.set("eye", state.eye);
  p.set("skin", state.skin);
  p.set("yaw", state.yaw);
  p.set("pitch", state.pitch);
  p.set("zoom", state.zoom.toFixed(2));
  p.set("bg", state.bg);
  if (!state.hairon) p.set("nohair", "1");
  if (state.expr !== "none") p.set("expr", state.expr + ":" + state.w.toFixed(2));
  for (const [key] of FACE_SLIDERS) p.set(key, state.face[key].toFixed(2));
  if (state.frame === "head") { p.set("target", "0,1.41,0"); p.set("radius", "0.21"); }
  p.set("t", Date.now());
  return "/render?" + p.toString();
}

function refresh(){
  const img = $("view");
  const id = ++reqId;
  img.classList.add("loading");
  $("hud_state").textContent = "rendering…";
  const q = buildQuery();
  let attempt = 0;

  const tryNext = () => {
    if (id !== reqId) return;
    if (attempt >= BASES.length) {
      img.classList.remove("loading");
      $("hud_state").textContent = "render error — is the server running?";
      $("hud_size").textContent = "try: vroid-rs serve";
      return;
    }
    const url = BASES[attempt++] + q;
    const probe = new Image();
    probe.onload = () => {
      if (id !== reqId) return;
      img.src = probe.src;
      img.classList.remove("loading");
      $("hud_state").textContent = "ready";
      $("hud_size").textContent = probe.naturalWidth + "×" + probe.naturalHeight;
    };
    probe.onerror = tryNext;
    probe.src = url;
  };
  tryNext();
}

function schedule(){ clearTimeout(timer); timer = setTimeout(refresh, 110); }

// framing
document.querySelectorAll("#framing button").forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll("#framing button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    state.frame = b.dataset.frame;
    if (state.frame === "head"){ state.zoom = 1.0; $("zoom").value = 1; $("zoom_o").textContent = "1.00"; }
    schedule();
  };
});

$("yaw").oninput = e => { state.yaw = +e.target.value; $("yaw_o").textContent = state.yaw + "°"; schedule(); };
$("pitch").oninput = e => { state.pitch = +e.target.value; $("pitch_o").textContent = state.pitch + "°"; schedule(); };
$("zoom").oninput = e => { state.zoom = +e.target.value; $("zoom_o").textContent = state.zoom.toFixed(2); schedule(); };
$("hair").oninput = e => { state.hair = e.target.value; schedule(); };
$("eye").oninput = e => { state.eye = e.target.value; schedule(); };
$("skin").oninput = e => { state.skin = e.target.value; schedule(); };
$("hairon").onchange = e => { state.hairon = e.target.checked; schedule(); };
$("expr").onchange = e => { state.expr = e.target.value; schedule(); };
$("w").oninput = e => { state.w = +e.target.value; $("w_o").textContent = state.w.toFixed(2); schedule(); };

document.querySelectorAll("#bgs .chip").forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll("#bgs .chip").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    state.bg = b.dataset.bg;
    schedule();
  };
});

$("save").onclick = () => {
  const a = document.createElement("a");
  a.href = $("view").src;
  a.download = "avatar.png";
  a.click();
};

$("reset").onclick = () => {
  Object.assign(state, {frame:"body", yaw:16, pitch:4, zoom:1, hair:"#c89a6b", eye:"#9e6642",
    skin:"#ffd8c6", hairon:true, expr:"none", w:0.72, bg:"171a21"});
  for (const [key] of FACE_SLIDERS){ state.face[key] = 0; $("f_"+key).value = 0; $("f_"+key+"_o").textContent = "0.00"; }
  $("yaw").value = 16; $("yaw_o").textContent = "16°";
  $("pitch").value = 4; $("pitch_o").textContent = "4°";
  $("zoom").value = 1; $("zoom_o").textContent = "1.00";
  $("hair").value = state.hair; $("eye").value = state.eye; $("skin").value = state.skin;
  $("hairon").checked = true; $("expr").value = "none"; $("w").value = 0.72; $("w_o").textContent = "0.72";
  document.querySelectorAll("#framing button").forEach(x=>x.classList.toggle("on", x.dataset.frame==="body"));
  document.querySelectorAll("#bgs .chip").forEach(x=>x.classList.toggle("on", x.dataset.bg==="171a21"));
  refresh();
};

refresh();
</script>
</body>
</html>
